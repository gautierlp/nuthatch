<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </defs>
  <g filter="url(#ink)" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- tree trunk -->
    <path d="M40 0 L40 512 L150 512 C160 420 146 340 158 256 C168 170 150 90 160 0 Z" fill="#fff" stroke-width="8"/>
    <!-- bark -->
    <path d="M70 40 C66 90 74 130 68 180 M108 20 C114 70 104 110 112 150 M80 250 C74 300 84 330 78 380 M120 440 C114 470 122 490 118 512 M64 440 C60 470 66 490 62 512" fill="none" stroke-width="5"/>
    <!-- the crack it hides things in -->
    <path d="M152 388 C124 392 96 404 82 426 C110 426 134 414 152 402 Z" fill="#000" stroke-width="5"/>
    <!-- the bird, head down -->
    <g transform="translate(-14 24) rotate(-52 256 256)">
      <!-- tail -->
      <path d="M384 232 L452 216 L462 252 L452 290 L386 276 Z" fill="#000" stroke-width="6"/>
      <!-- body, pale belly toward the trunk -->
      <ellipse cx="292" cy="256" rx="110" ry="62" fill="#fff" stroke-width="6"/>
      <!-- dark back -->
      <path d="M196 268 C214 304 256 320 304 318 C352 316 394 296 402 258 C372 280 330 290 288 288 C250 286 220 280 196 268 Z" fill="#000" stroke-width="6"/>
      <!-- head -->
      <circle cx="178" cy="256" r="48" fill="#fff" stroke-width="6"/>
      <!-- dark cap -->
      <path d="M150 290 C168 306 200 308 220 290 C222 284 224 280 224 276 C202 286 172 288 150 290 Z" fill="#000" stroke-width="5"/>
      <!-- eye stripe -->
      <path d="M134 258 C160 260 190 262 214 270" fill="none" stroke-width="11"/>
      <!-- eye -->
      <circle cx="164" cy="260" r="7" fill="#fff" stroke="#000" stroke-width="3"/>
      <!-- beak -->
      <path d="M140 242 L72 256 L140 270 Z" fill="#000" stroke-width="6"/>
      <!-- feet on the bark -->
      <path d="M262 196 L254 150 M246 146 L254 150 L258 140 M306 196 L304 150 M296 146 L304 150 L310 140" fill="none" stroke-width="6"/>
    </g>
    <!-- the chat bubble it tucks into the crack -->
    <g transform="rotate(-18 112 404)">
      <path d="M78 404 C78 392 88 384 100 384 L124 384 C136 384 144 392 144 404 C144 416 136 424 124 424 L104 424 L90 436 L94 423 C84 421 78 414 78 404 Z" fill="#fff" stroke-width="5"/>
      <path d="M96 404 L126 404" fill="none" stroke-width="4"/>
    </g>
  </g>
  <!-- ink spots -->
  <g fill="#000">
    <circle cx="420" cy="440" r="3"/><circle cx="448" cy="420" r="2"/><circle cx="470" cy="300" r="2.5"/>
    <circle cx="390" cy="60" r="2"/><circle cx="300" cy="470" r="2.5"/><circle cx="230" cy="96" r="2"/>
  </g>
</svg>
